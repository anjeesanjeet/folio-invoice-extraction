<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio: review</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/folio.css">
<style>
  .work { display: grid; grid-template-columns: 290px minmax(0, 1fr) 460px; height: 100vh; }
  .inbox { border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
  .drop { margin: 18px; border: 1px dashed var(--rule-strong); border-radius: 6px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--gold); color: var(--gold); }
  .drop strong { display: block; color: var(--paper); font-family: var(--serif); font-size: 17px; font-weight: 500; margin-bottom: 4px; }
  .exports { display: flex; gap: 8px; padding: 0 18px 14px; }
  .exports .btn { flex: 1; text-align: center; padding: 6px 8px; font-size: 12.5px; }
  .list { overflow-y: auto; flex: 1; border-top: 1px solid var(--rule); }
  .item { padding: 12px 18px; border-bottom: 1px solid var(--rule); cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .item:hover { background: var(--panel); }
  .item[aria-current="true"] { background: var(--raised); box-shadow: inset 2px 0 0 var(--gold); }
  .item .v { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .f { font: 12px var(--mono); color: var(--faint); }
  .item .amt { font: 500 13px var(--mono); text-align: right; }
  .stage { overflow: auto; padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 18px; background:
           radial-gradient(circle at 50% 0, #1A1D24 0, var(--night) 70%); }
  .stage img { max-width: min(760px, 100%); box-shadow: 0 30px 60px rgba(0,0,0,.55), 0 0 0 1px #000; border-radius: 2px; background: #fff; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 360px; }
  .empty .big { font-family: var(--serif); font-size: 28px; color: var(--paper); font-style: italic; display: block; margin-bottom: 8px; }
  .ledger { border-left: 1px solid var(--rule); overflow-y: auto; padding: 24px 24px 40px; background: var(--panel); }
  .verdict { padding-bottom: 18px; border-bottom: 1px solid var(--rule); margin-bottom: 8px; }
  .verdict h2 { margin: 6px 0 4px; }
  .frow { display: grid; grid-template-columns: 14px 120px minmax(0, 1fr); gap: 10px; align-items: start; padding: 11px 0; border-bottom: 1px solid var(--rule); }
  .frow .dot { margin-top: 9px; }
  .frow label { font: 500 12px var(--mono); color: var(--muted); padding-top: 7px; }
  .frow input { width: 100%; font: 14px var(--mono); color: var(--paper); background: var(--night); border: 1px solid var(--rule); border-radius: 3px; padding: 6px 9px; }
  .frow.flag input { border-color: #34507A; }
  .frow .why { grid-column: 3; font-size: 12.5px; color: var(--review); margin-top: 4px; }
  .frow .ev { grid-column: 3; font: 12px var(--mono); color: var(--faint); margin-top: 3px; }
  table.items { width: 100%; border-collapse: collapse; font: 12.5px var(--mono); margin-top: 6px; }
  table.items th { text-align: left; color: var(--faint); font-weight: 500; padding: 4px 6px 4px 0; border-bottom: 1px solid var(--rule); }
  table.items td { padding: 5px 6px 5px 0; border-bottom: 1px solid var(--rule); }
  table.items td.n, table.items th.n { text-align: right; }
  .actions { display: flex; gap: 10px; margin: 22px 0 10px; flex-wrap: wrap; }
  .steps { margin-top: 26px; font-size: 13px; }
  .steps div { display: grid; grid-template-columns: 90px 1fr auto; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .busy { color: var(--gold); font-size: 13px; padding: 0 18px 12px; }
  @media (max-width: 1200px) { .work { grid-template-columns: 260px 1fr; } .ledger { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="shell">
<aside class="rail"><div class="brand">Folio<small>Invoice extraction you can audit</small></div><nav><a href="/review" aria-current="page">Review</a><a href="/dashboard" >Results</a><a href="/flowchart" >How it works</a></nav><div class="foot" id="railFoot"></div></aside>
<main class="work">
  <section class="inbox" aria-label="Documents">
    <label class="drop" id="drop" tabindex="0">
      <strong>Drop an invoice</strong>PDF, scan or photo. Or click to choose.
      <input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.tif,.tiff" hidden>
    </label>
    <div class="busy" id="busy" hidden>Reading the document and checking every field…</div>
    <div class="exports"><a class="btn line" href="/api/export/xlsx">Excel</a><a class="btn line" href="/api/export/csv">CSV</a></div>
    <div class="list" id="list"></div>
  </section>
  <section class="stage" id="stage"><div class="empty"><span class="big">Nothing open</span>Choose a document on the left, or drop a new one.</div></section>
  <section class="ledger" id="ledger"></section>
</main>
</div>
<script src="/static/js/review.js"></script>
</body>
</html>
